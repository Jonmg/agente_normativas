# Despliegue de la demo de CitaCerca (citas_clinicas/) en Render.
# Render lee este fichero al crear un "Blueprint" desde el repositorio.
services:
  - type: web
    name: citacerca-demo
    runtime: python
    plan: free
    rootDir: citas_clinicas
    branch: claude/health-clinics-booking-platform-uo0ckk
    buildCommand: pip install -r requirements.txt
    # Un solo proceso: SQLite y la siembra inicial no se reparten entre workers.
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT "app:crear_app()"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: Europe/Madrid
      - key: CITAS_DEMO
        value: "1"
      - key: CITAS_SECRETO
        generateValue: true
      - key: CITAS_TARIFA
        value: "8"
      # Recordatorio semanal: clave compartida con GitHub Actions (secreto CITAS_TAREAS_CLAVE).
      - key: CITAS_TAREAS_CLAVE
        sync: false
      # Correo (opcional; sin él los avisos quedan en la bandeja del panel de administración):
      # CITAS_SMTP_HOST, CITAS_SMTP_PUERTO, CITAS_SMTP_USUARIO, CITAS_SMTP_CLAVE, CITAS_SMTP_REMITENTE.
      # Para una cuenta de administración propia (además de admin@demo.es en la demo),
      # añade en el panel de Render CITAS_ADMIN_EMAIL y CITAS_ADMIN_CLAVE.
