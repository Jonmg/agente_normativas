<style>
/* Layout: una sola columna estrecha tipo libreta, pestañas grandes abajo; pensada para el móvil y dedos que no tienen prisa. */
:root {
  --bg: #F3F5F2;
  --card: #FFFFFF;
  --ink: #16241F;
  --muted: #5A6B64;
  --line: #D6DED9;
  --accent: #1E6B57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE5;
  --amber: #B7791F;
  --amber-soft: #F6E9D2;
  --ok: #2E7D4F;
  --warn: #A63D2F;
  --warn-soft: #F7E1DD;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101815; --card: #18231F; --ink: #E7EFEB; --muted: #9DB0A8; --line: #2C3B35;
    --accent: #5FC2A4; --accent-ink: #0C1713; --accent-soft: #1F3A31;
    --amber: #E3A94D; --amber-soft: #3A2E1A; --ok: #6BCB8E; --warn: #F08A7A; --warn-soft: #3D211D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101815; --card: #18231F; --ink: #E7EFEB; --muted: #9DB0A8; --line: #2C3B35;
  --accent: #5FC2A4; --accent-ink: #0C1713; --accent-soft: #1F3A31;
  --amber: #E3A94D; --amber-soft: #3A2E1A; --ok: #6BCB8E; --warn: #F08A7A; --warn-soft: #3D211D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.fecha { color: var(--muted); font-size: 1rem; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn { min-height: 52px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.sec { background: transparent; color: var(--accent); }
.btn.peq { min-height: 40px; padding: 6px 12px; font-size: .95rem; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; padding: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.escala .chip { padding: 4px; font-size: .95rem; line-height: 1.15; }
.escala .chip b { display: block; font-family: var(--f-num); font-size: 1.5rem; }

.alerta { background: var(--warn-soft); border: 2px solid var(--warn); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.alerta strong { color: var(--warn); }
.aviso { background: var(--amber-soft); border-radius: 12px; padding: 10px 14px; font-size: .95rem; }

.ej { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; padding-block: 14px; border-top: 1px solid var(--line); }
.ej:first-of-type { border-top: 0; }
.check { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--line); background: transparent; display: grid; place-items: center; }
.check svg { width: 28px; height: 28px; stroke: var(--accent-ink); stroke-width: 3.5; fill: none; opacity: 0; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.check[aria-pressed="true"] svg { opacity: 1; }
.ej-cuerpo { display: grid; gap: 8px; min-width: 0; }
.ej-nombre { font-weight: 700; font-size: 1.1rem; }
.ej.hecho .ej-nombre { color: var(--muted); }
.ej-grupo { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.ej-pauta { font-size: .95rem; color: var(--muted); }
.campos { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.campo { display: grid; gap: 2px; font-size: .85rem; color: var(--muted); }
.campo input { width: 92px; min-height: 48px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); padding: 4px 10px; font-family: var(--f-num); font-size: 1.4rem; color: var(--ink); }
.sens { display: flex; gap: 6px; flex-wrap: wrap; }
.sens .chip { min-height: 40px; padding: 4px 12px; font-size: .9rem; }
.sube { font-size: .9rem; color: var(--amber); font-weight: 700; }

.progreso-dia { height: 12px; background: var(--accent-soft); border-radius: 6px; overflow: hidden; }
.progreso-dia i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.tile .num { font-size: 2.2rem; line-height: 1; }
.tile span:last-child { font-size: .85rem; color: var(--muted); }

.grafico { width: 100%; height: auto; display: block; }
.grafico text { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
.grafico .rejilla { stroke: var(--line); stroke-width: 1; }
.historial { display: grid; gap: 0; }
.hist { display: flex; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.hist:first-child { border-top: 0; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
nav.tabs button { min-height: 64px; border: 0; background: transparent; font-weight: 700; color: var(--muted); border-top: 4px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

.lista-ajustes { display: grid; gap: 0; }
.lista-ajustes label { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); min-height: 52px; }
.lista-ajustes input[type="checkbox"] { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
select { min-height: 48px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); padding: 4px 10px; max-width: 100%; }
.estado-datos { font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 380px) { .tiles .num { font-size: 1.8rem; } .escala .chip { font-size: .8rem; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 id="saludo">Cuaderno de Fuerza</h1>
    <span class="fecha" id="fechaHoy"></span>
  </header>

  <main id="vista"></main>
  <p class="estado-datos" id="estadoDatos">Guardando en este dispositivo.</p>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <button role="tab" id="tab-hoy" data-tab="hoy" aria-selected="true">Hoy</button>
  <button role="tab" id="tab-progreso" data-tab="progreso" aria-selected="false">Progreso</button>
  <button role="tab" id="tab-ajustes" data-tab="ajustes" aria-selected="false">Ajustes</button>

<script>
"use strict";

/* ---------- Catálogo de ejercicios ----------
   Pensados para recuperar fuerza con máquinas guiadas y poco riesgo.
   tipo "fuerza": series × repeticiones + peso. tipo "tiempo": minutos. */
const CATALOGO = [
  // Calentamiento / cardio suave
  { id: "bici", nombre: "Bicicleta estática", grupo: "Calentamiento", tipo: "tiempo", min: 10, pauta: "Ritmo suave, que puedas hablar sin ahogarte." },
  { id: "cinta", nombre: "Cinta caminando", grupo: "Calentamiento", tipo: "tiempo", min: 10, pauta: "Sin inclinación al principio. Agárrate si lo necesitas." },
  { id: "eliptica", nombre: "Elíptica", grupo: "Calentamiento", tipo: "tiempo", min: 8, pauta: "Resistencia baja, movimiento continuo." },
  { id: "bicirec", nombre: "Bici reclinada", grupo: "Calentamiento", tipo: "tiempo", min: 10, pauta: "Espalda apoyada, pedaleo cómodo." },
  // Piernas
  { id: "prensa", nombre: "Prensa de piernas", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 30, pauta: "Baja despacio, sin bloquear las rodillas al estirar." },
  { id: "extension", nombre: "Extensión de cuádriceps", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 10, pauta: "Sube en 2 segundos, baja en 3." },
  { id: "femoral", nombre: "Curl femoral sentado", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 10, pauta: "Movimiento controlado, sin tirones." },
  { id: "abductor", nombre: "Abductores en máquina", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 15, pauta: "Abre despacio, espalda pegada al respaldo." },
  { id: "aductor", nombre: "Aductores en máquina", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 15, pauta: "Cierra despacio, sin rebote." },
  { id: "silla", nombre: "Levantarse de la silla", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 8, peso: 0, pauta: "Sin usar las manos si puedes. Peso = 0." },
  { id: "talones", nombre: "Elevación de talones con apoyo", grupo: "Piernas", tipo: "fuerza", series: 2, reps: 12, peso: 0, pauta: "Agarrado a una barra. Peso = 0." },
  // Tren superior
  { id: "remo", nombre: "Remo sentado en máquina", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 12, peso: 15, pauta: "Saca pecho y junta los omóplatos al tirar." },
  { id: "jalon", nombre: "Jalón al pecho", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 12, peso: 15, pauta: "Tira hacia la parte alta del pecho, no detrás de la nuca." },
  { id: "pecho", nombre: "Press de pecho en máquina", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 12, peso: 10, pauta: "Empuja soltando el aire. No aguantes la respiración." },
  { id: "biceps", nombre: "Curl de bíceps en máquina", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 12, peso: 5, pauta: "Codos quietos, sin balancear el cuerpo." },
  { id: "triceps", nombre: "Tríceps en polea", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 12, peso: 5, pauta: "Codos pegados al cuerpo." },
  { id: "hombro", nombre: "Press de hombro en máquina", grupo: "Espalda y brazos", tipo: "fuerza", series: 2, reps: 10, peso: 5, pauta: "Peso muy ligero. Para si notas molestia." },
  // Equilibrio y movilidad
  { id: "equilibrio", nombre: "Equilibrio a una pierna con apoyo", grupo: "Equilibrio", tipo: "tiempo", min: 2, pauta: "20 segundos por pierna, varias veces. Siempre con algo a mano." },
  { id: "puente", nombre: "Puente de glúteo en colchoneta", grupo: "Equilibrio", tipo: "fuerza", series: 2, reps: 10, peso: 0, pauta: "Sube la cadera despacio. Peso = 0." },
  { id: "marcha", nombre: "Marcha en el sitio levantando rodillas", grupo: "Equilibrio", tipo: "tiempo", min: 2, pauta: "Con apoyo cerca. Rodillas a altura cómoda." },
  // Vuelta a la calma
  { id: "estiramientos", nombre: "Estiramientos suaves", grupo: "Vuelta a la calma", tipo: "tiempo", min: 5, pauta: "Piernas, espalda y hombros. Sin rebotes, sin dolor." },
];
const POR_ID = Object.fromEntries(CATALOGO.map(e => [e.id, e]));
// Estructura de una sesión de gimnasio: cuántos ejercicios de cada grupo.
const ESTRUCTURA = [["Calentamiento", 1], ["Piernas", 2], ["Espalda y brazos", 2], ["Equilibrio", 1], ["Vuelta a la calma", 1]];
// Plan por defecto según el día de la semana (0 = domingo).
const PLAN_SEMANA = ["descanso", "gym", "paseo", "gym", "paseo", "gym", "paseo"];
const TIPOS = { gym: "Gimnasio", paseo: "Paseo", descanso: "Descanso" };
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function claveFecha(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function deClave(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function fechaLarga(d) { return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; }
function fechaCorta(d) { return `${d.getDate()}/${d.getMonth() + 1}`; }
// Aleatorio reproducible a partir de una semilla: el mismo día da la misma sesión.
function azar(semilla) { let h = 2166136261; for (const c of semilla) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }

/* ---------- Almacenamiento ----------
   Primero en este dispositivo (localStorage). Si la página se abre en claude.ai con sesión iniciada,
   pasa a guardarse en la cuenta y así se ve igual desde el móvil y el ordenador. */
const LS = "cuaderno-fuerza-v1";
const Datos = {
  dias: {}, ajustes: { nombre: "", desactivados: [] }, modo: "local", db: null, uid: null,
  cargarLocal() {
    try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j) { this.dias = j.dias || {}; this.ajustes = Object.assign(this.ajustes, j.ajustes || {}); } } catch (e) {}
  },
  guardarLocal() { try { localStorage.setItem(LS, JSON.stringify({ dias: this.dias, ajustes: this.ajustes })); } catch (e) {} },
  async conectarNube() {
    try {
      if (!window.claude?.use) return false;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return false;
      const uid = await user.id();
      if (!uid) return false;
      // Colección privada del usuario: un documento "dia-AAAA-MM-DD" por día y otro "ajustes".
      const snap = await db.collection(`data/users/${uid}`).limit(1000).get();
      const remotos = {};
      let aj = null;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        if (d.id.startsWith("dia-")) remotos[d.id.slice(4)] = structuredClone(d.data());
        else if (d.id === "ajustes") aj = structuredClone(d.data());
      });
      this.db = db; this.uid = uid; this.modo = "nube";
      // Lo que se apuntó en el dispositivo antes de conectar se sube sin pisar lo que ya hay en la cuenta.
      for (const [k, v] of Object.entries(this.dias)) if (!remotos[k] && !v.nuevo) { remotos[k] = v; this.subirDia(k, v); }
      this.dias = remotos;
      if (aj) this.ajustes = Object.assign({ nombre: "", desactivados: [] }, aj);
      else this.subirAjustes();
      this.guardarLocal();
      return true;
    } catch (e) { return false; }
  },
  colas: {},
  subirDia(k, v) {
    if (!this.db) return;
    // Una escritura cada vez por documento: si llega otra mientras tanto, se envía al terminar.
    const c = this.colas[k] || (this.colas[k] = { enCurso: false, pendiente: null });
    c.pendiente = structuredClone(v);
    if (c.enCurso) return;
    const enviar = async () => {
      c.enCurso = true;
      while (c.pendiente) { const body = c.pendiente; c.pendiente = null; try { await this.db.doc(`data/users/${this.uid}/dia-${k}`).set(body); } catch (e) { avisoGuardado(false); } }
      c.enCurso = false;
    };
    enviar();
  },
  subirAjustes() { if (this.db) this.db.doc(`data/users/${this.uid}/ajustes`).set(structuredClone(this.ajustes)).catch(() => avisoGuardado(false)); },
  guardarDia(k) { this.dias[k].actualizado = Date.now(); this.guardarLocal(); this.subirDia(k, this.dias[k]); },
  guardarAjustes() { this.guardarLocal(); this.subirAjustes(); },
};
function avisoGuardado(ok) {
  const el = $("#estadoDatos");
  if (!ok) { el.textContent = "No se pudo guardar en la cuenta. Lo apuntado sigue en este dispositivo."; return; }
  el.textContent = Datos.modo === "nube" ? "Guardado en tu cuenta: se ve igual en el móvil y en el ordenador." : "Guardando en este dispositivo.";
}

/* ---------- Historial y progresión ---------- */
// Últimos registros hechos de un ejercicio, del más reciente al más antiguo (sin contar el día indicado).
function historialEj(id, antesDe) {
  return Object.keys(Datos.dias).filter(k => k < antesDe).sort().reverse()
    .map(k => ({ k, e: (Datos.dias[k].ejercicios || []).find(x => x.id === id && x.hecho) }))
    .filter(x => x.e);
}
// Si las dos últimas veces le resultó "fácil", se sugiere subir un poco.
function sugerenciaSubir(id, hoy) {
  const h = historialEj(id, hoy).slice(0, 2);
  if (h.length < 2 || !h.every(x => x.e.sensacion === "facil")) return "";
  const ej = POR_ID[id];
  if (ej.tipo === "tiempo") return "Las dos últimas veces fue fácil: puedes probar con 2 minutos más.";
  if (!h[0].e.peso) return "Las dos últimas veces fue fácil: puedes probar con 2 repeticiones más.";
  return "Las dos últimas veces fue fácil: puedes probar a subir un punto de peso.";
}

function generarSesion(k, excluir = []) {
  const r = azar(k + excluir.join(""));
  const activos = CATALOGO.filter(e => !Datos.ajustes.desactivados.includes(e.id));
  // Evita repetir lo de la última sesión de gimnasio cuando hay alternativa.
  const ultima = Object.keys(Datos.dias).filter(x => x < k && Datos.dias[x].tipo === "gym").sort().pop();
  const recientes = new Set(ultima ? (Datos.dias[ultima].ejercicios || []).map(e => e.id) : []);
  const elegidos = [];
  for (const [grupo, n] of ESTRUCTURA) {
    let pool = activos.filter(e => e.grupo === grupo && !excluir.includes(e.id));
    const frescos = pool.filter(e => !recientes.has(e.id));
    if (frescos.length >= n) pool = frescos;
    pool = pool.map(e => [r(), e]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    elegidos.push(...pool.slice(0, n));
  }
  return elegidos.map(e => nuevaEntrada(e, k));
}
function nuevaEntrada(e, k) {
  const prev = historialEj(e.id, k)[0]?.e;
  const base = { id: e.id, hecho: false, sensacion: "" };
  if (e.tipo === "tiempo") return { ...base, min: prev?.min ?? e.min };
  return { ...base, series: prev?.series ?? e.series, reps: prev?.reps ?? e.reps, peso: prev?.peso ?? e.peso };
}
function diaDe(k) {
  if (!Datos.dias[k]) {
    const tipo = PLAN_SEMANA[deClave(k).getDay()];
    Datos.dias[k] = { fecha: k, tipo, energia: 0, alerta: false, ejercicios: tipo === "gym" ? generarSesion(k) : [], paseo: { min: "", km: "", esfuerzo: "" }, nota: "", nuevo: true };
  }
  return Datos.dias[k];
}
// Un día "nuevo" solo se guarda cuando se toca algo, para no llenar el historial de días vacíos.
function tocar(k) { delete Datos.dias[k].nuevo; Datos.guardarDia(k); }
function diaActivo(d) {
  if (!d || d.nuevo) return false;
  return (d.ejercicios || []).some(e => e.hecho) || Number(d.paseo?.min) > 0;
}

/* ---------- Vista: Hoy ---------- */
let pestaña = "hoy";
const HOY = claveFecha(new Date());
const SVG_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ENERGIA = [["1", "Muy flojo"], ["2", "Flojo"], ["3", "Normal"], ["4", "Bien"], ["5", "Muy bien"]];

function pintarHoy() {
  const d = diaDe(HOY);
  const nombre = Datos.ajustes.nombre ? `, ${esc(Datos.ajustes.nombre)}` : "";
  let h = `<div class="wrap" style="padding:0">`;
  h += `<section class="card" aria-labelledby="t-energia">
    <h2 id="t-energia">¿Cómo te encuentras hoy${nombre}?</h2>
    <div class="escala" role="group" aria-label="Energía de hoy">${ENERGIA.map(([v, t]) => `<button class="chip" data-energia="${v}" aria-pressed="${String(d.energia) === v}"><b>${v}</b>${t}</button>`).join("")}</div>
    ${d.energia && d.energia <= 2 ? `<p class="aviso">Día flojo: haz solo lo que te apetezca, a menos peso o menos tiempo. Un paseo corto también cuenta.</p>` : ""}
    <button class="btn sec peq" data-alerta style="justify-self:start">${d.alerta ? "Ocultar señales de alarma" : "Tengo alguna molestia"}</button>
    ${d.alerta ? alarma() : ""}
  </section>`;

  h += `<section class="card" aria-labelledby="t-plan">
    <h2 id="t-plan">Hoy toca</h2>
    <div class="chips" role="group" aria-label="Tipo de día">${Object.entries(TIPOS).map(([v, t]) => `<button class="chip" data-tipo="${v}" aria-pressed="${d.tipo === v}">${t}</button>`).join("")}</div>
  </section>`;

  if (d.tipo === "gym") h += pintarGym(d);
  if (d.tipo === "paseo") h += pintarPaseo(d);
  if (d.tipo === "descanso") h += `<section class="card"><h2>Día de descanso</h2><p class="muted">Descansar también es parte del plan: el músculo se recupera hoy. Si te apetece, un paseo tranquilo de 10–15 minutos está bien.</p></section>`;
  if (d.tipo !== "paseo" && Number(d.paseo?.min) > 0) h += pintarPaseo(d);

  h += `<section class="card"><label class="campo" for="nota" style="font-size:1rem;color:var(--ink)"><b>Nota del día</b><span class="muted small">Molestias, cómo dormiste, lo que dijo el médico…</span></label>
    <textarea id="nota" rows="3" style="font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;width:100%">${esc(d.nota)}</textarea></section>`;
  h += `</div>`;
  $("#vista").innerHTML = h;
}

function alarma() {
  return `<div class="alerta" role="alert">
    <strong>Para y no sigas entrenando si notas:</strong>
    <span>dolor u opresión en el pecho, falta de aire que no se pasa al parar, mareo, palpitaciones fuertes, sudor frío, o dolor, hinchazón o enrojecimiento en la zona de la operación.</span>
    <span>Si es fuerte o no se pasa en unos minutos, llama al <b class="num" style="font-size:1.3rem">112</b>. Si es leve, coméntalo con tu médico antes de volver a entrenar.</span>
  </div>`;
}

function pintarGym(d) {
  const ejs = d.ejercicios || [];
  const hechos = ejs.filter(e => e.hecho).length;
  const pct = ejs.length ? Math.round(hechos / ejs.length * 100) : 0;
  let h = `<section class="card" aria-labelledby="t-gym">
    <div class="top"><h2 id="t-gym">Sesión de gimnasio</h2><span class="num" style="font-size:1.5rem">${hechos}/${ejs.length}</span></div>
    <div class="progreso-dia" aria-hidden="true"><i style="width:${pct}%"></i></div>
    ${hechos === ejs.length && ejs.length ? `<p class="aviso" style="background:var(--accent-soft)"><b>Sesión completa.</b> Bien hecho. Bebe agua y descansa.</p>` : ""}
    <div>`;
  ejs.forEach((e, i) => {
    const c = POR_ID[e.id]; if (!c) return;
    const sube = !e.hecho ? sugerenciaSubir(e.id, HOY) : "";
    h += `<div class="ej ${e.hecho ? "hecho" : ""}">
      <button class="check" data-check="${i}" aria-pressed="${e.hecho}" aria-label="Marcar ${esc(c.nombre)} como hecho">${SVG_CHECK}</button>
      <div class="ej-cuerpo">
        <span class="ej-grupo">${esc(c.grupo)}</span>
        <span class="ej-nombre">${esc(c.nombre)}</span>
        <span class="ej-pauta">${esc(c.pauta)}</span>
        <div class="campos">${c.tipo === "tiempo"
          ? campo(i, "min", "Minutos", e.min)
          : campo(i, "series", "Series", e.series) + campo(i, "reps", "Repeticiones", e.reps) + campo(i, "peso", "Peso (kg)", e.peso, "0.5")}
        </div>
        ${sube ? `<span class="sube">${sube}</span>` : ""}
        ${e.hecho ? `<div class="sens" role="group" aria-label="¿Cómo fue?">${[["facil", "Fácil"], ["bien", "Bien"], ["duro", "Duro"]].map(([v, t]) => `<button class="chip" data-sens="${i}" data-v="${v}" aria-pressed="${e.sensacion === v}">${t}</button>`).join("")}</div>` : ""}
        ${!e.hecho ? `<button class="btn sec peq" data-cambiar="${i}" style="justify-self:start">Cambiar por otro</button>` : ""}
      </div>
    </div>`;
  });
  h += `</div><button class="btn sec" data-regenerar>Darme otra sesión distinta</button>
    <p class="muted small">Respira con normalidad durante cada repetición. Descansa 1–2 minutos entre series. Si algo duele, déjalo y márcalo como "Duro".</p>
  </section>`;
  return h;
}
function campo(i, k, etiqueta, v, paso = "1") {
  return `<label class="campo">${etiqueta}<input class="num" type="number" inputmode="decimal" min="0" step="${paso}" id="c-${i}-${k}" data-campo="${i}" data-k="${k}" value="${esc(v)}"></label>`;
}

function pintarPaseo(d) {
  const p = d.paseo || {};
  const ultimos = Object.keys(Datos.dias).filter(k => k < HOY && Number(Datos.dias[k].paseo?.min) > 0).sort().slice(-1);
  const ref = ultimos.length ? `La última vez: <b class="num">${Datos.dias[ultimos[0]].paseo.min} min</b>${Datos.dias[ultimos[0]].paseo.km ? ` · ${Datos.dias[ultimos[0]].paseo.km} km` : ""}.` : "Empieza con lo que te resulte cómodo, por ejemplo 15–20 minutos.";
  return `<section class="card" aria-labelledby="t-paseo">
    <h2 id="t-paseo">Paseo</h2>
    <p class="muted small" style="margin:0">${ref} Ve sumando poco a poco: unos 5 minutos más por semana es buen ritmo.</p>
    <div class="campos">
      <label class="campo">Minutos<input class="num" type="number" inputmode="decimal" min="0" id="p-min" data-paseo="min" value="${esc(p.min)}"></label>
      <label class="campo">Kilómetros<input class="num" type="number" inputmode="decimal" min="0" step="0.1" id="p-km" data-paseo="km" value="${esc(p.km)}"></label>
    </div>
    <div class="sens" role="group" aria-label="¿Cómo fue el paseo?">${[["facil", "Fácil"], ["bien", "Bien"], ["duro", "Duro"]].map(([v, t]) => `<button class="chip" data-psens="${v}" aria-pressed="${p.esfuerzo === v}">${t}</button>`).join("")}</div>
  </section>`;
}

/* ---------- Vista: Progreso ---------- */
function lunesDe(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; }
function pintarProgreso() {
  const claves = Object.keys(Datos.dias).filter(k => diaActivo(Datos.dias[k])).sort();
  const lunes = lunesDe(new Date());
  const semanas = [];
  for (let i = 7; i >= 0; i--) { const s = new Date(lunes); s.setDate(s.getDate() - 7 * i); semanas.push({ inicio: s, minPaseo: 0, gym: 0 }); }
  for (const k of claves) {
    const d = Datos.dias[k], f = deClave(k);
    const s = semanas.find(w => f >= w.inicio && f < new Date(w.inicio.getTime() + 7 * 864e5));
    if (!s) continue;
    s.minPaseo += Number(d.paseo?.min) || 0;
    if ((d.ejercicios || []).some(e => e.hecho)) s.gym++;
  }
  const estaSemana = semanas[semanas.length - 1];
  // Racha: días seguidos (hasta hoy o ayer) con algo hecho, contando los días de descanso planificados.
  let racha = 0; const cur = new Date();
  if (!diaActivo(Datos.dias[HOY])) cur.setDate(cur.getDate() - 1);
  while (true) {
    const k = claveFecha(cur), d = Datos.dias[k];
    if (diaActivo(d)) racha++;
    else if (!(d?.tipo === "descanso" || (!d && PLAN_SEMANA[cur.getDay()] === "descanso"))) break;
    cur.setDate(cur.getDate() - 1);
    if (racha > 3650) break;
  }

  const fuerza = CATALOGO.filter(e => e.tipo === "fuerza" && claves.some(k => (Datos.dias[k].ejercicios || []).some(x => x.id === e.id && x.hecho && Number(x.peso) > 0)));
  let sel = sessionSel && fuerza.some(e => e.id === sessionSel) ? sessionSel : fuerza[0]?.id;

  let h = `<div class="wrap" style="padding:0">
    <div class="tiles">
      <div class="tile"><span class="eyebrow">Racha</span><span class="num">${racha}</span><span>días seguidos</span></div>
      <div class="tile"><span class="eyebrow">Gimnasio</span><span class="num">${estaSemana.gym}</span><span>sesiones esta semana</span></div>
      <div class="tile"><span class="eyebrow">Paseo</span><span class="num">${estaSemana.minPaseo}</span><span>min esta semana</span></div>
    </div>`;
  if (!claves.length) {
    h += `<section class="card"><h2>Aquí verás cómo mejoras</h2><p class="muted">Cuando marques ejercicios o apuntes un paseo en la pestaña <b>Hoy</b>, aparecerán aquí los minutos andados por semana, cómo sube el peso en cada máquina y el historial de días.</p></section></div>`;
    $("#vista").innerHTML = h; return;
  }
  h += `<section class="card"><h2>Minutos andando por semana</h2>${graficoBarras(semanas)}</section>`;
  h += `<section class="card"><h2>Peso en las máquinas</h2>`;
  if (fuerza.length) {
    h += `<label class="campo" for="selMaquina">Máquina<select id="selMaquina">${fuerza.map(e => `<option value="${e.id}" ${e.id === sel ? "selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></label>`;
    const pts = claves.map(k => ({ k, e: (Datos.dias[k].ejercicios || []).find(x => x.id === sel && x.hecho) })).filter(x => x.e && Number(x.e.peso) > 0).map(x => ({ k: x.k, v: Number(x.e.peso) }));
    h += graficoLinea(pts);
    if (pts.length >= 2) { const dif = pts[pts.length - 1].v - pts[0].v; h += `<p class="muted small" style="margin:0">Desde el ${fechaCorta(deClave(pts[0].k))}: ${dif > 0 ? `<b style="color:var(--ok)">+${dif} kg</b>` : dif === 0 ? "mismo peso" : `${dif} kg`}.</p>`; }
  } else h += `<p class="muted">Aún no hay máquinas con peso apuntado.</p>`;
  h += `</section>`;
  h += `<section class="card"><h2>Últimos días</h2><div class="historial">${claves.slice(-14).reverse().map(k => {
    const d = Datos.dias[k], hechos = (d.ejercicios || []).filter(e => e.hecho).length;
    const partes = [];
    if (hechos) partes.push(`${hechos} ejercicio${hechos > 1 ? "s" : ""}`);
    if (Number(d.paseo?.min) > 0) partes.push(`${d.paseo.min} min andando`);
    return `<div class="hist"><span>${fechaLarga(deClave(k))}</span><span class="muted">${partes.join(" · ")}</span></div>`;
  }).join("")}</div></section></div>`;
  $("#vista").innerHTML = h;
}
let sessionSel = null;

function graficoBarras(semanas) {
  const W = 340, H = 180, iz = 34, ab = 24, ar = 12;
  const max = Math.max(60, ...semanas.map(s => s.minPaseo));
  const tope = Math.ceil(max / 30) * 30;
  const y = v => ar + (H - ar - ab) * (1 - v / tope);
  const bw = (W - iz - 8) / semanas.length;
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos andando en las últimas 8 semanas">`;
  for (let v = 0; v <= tope; v += tope / 3) s += `<line class="rejilla" x1="${iz}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${iz - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  semanas.forEach((w, i) => {
    const x = iz + 4 + i * bw, alto = y(0) - y(w.minPaseo), ult = i === semanas.length - 1;
    s += `<rect x="${x + 3}" y="${y(w.minPaseo)}" width="${bw - 6}" height="${Math.max(alto, 0)}" rx="3" fill="var(${ult ? "--accent" : "--accent-soft"})"/>`;
    if (w.minPaseo) s += `<text x="${x + bw / 2}" y="${y(w.minPaseo) - 4}" text-anchor="middle" style="fill:var(--ink)">${w.minPaseo}</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${fechaCorta(w.inicio)}</text>`;
  });
  return s + `</svg><p class="muted small" style="margin:0">Cada barra es una semana (empieza en lunes). La oscura es la actual.</p>`;
}
function graficoLinea(pts) {
  if (!pts.length) return `<p class="muted">Sin datos para esta máquina.</p>`;
  const W = 340, H = 170, iz = 34, de = 14, ab = 24, ar = 14;
  const vals = pts.map(p => p.v), min = Math.max(0, Math.floor((Math.min(...vals) - 5) / 5) * 5), max = Math.ceil((Math.max(...vals) + 5) / 5) * 5;
  const x = i => pts.length === 1 ? (iz + W - de) / 2 : iz + 8 + (W - iz - de - 8) * i / (pts.length - 1);
  const y = v => ar + (H - ar - ab) * (1 - (v - min) / (max - min));
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">`;
  for (let v = min; v <= max; v += (max - min) / 2) s += `<line class="rejilla" x1="${iz}" x2="${W - de}" y1="${y(v)}" y2="${y(v)}"/><text x="${iz - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  const linea = pts.map((p, i) => `${x(i)},${y(p.v)}`).join(" ");
  s += `<polygon points="${x(0)},${y(min)} ${linea} ${x(pts.length - 1)},${y(min)}" fill="var(--accent-soft)" opacity=".7"/>`;
  s += `<polyline points="${linea}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { const ult = i === pts.length - 1; s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${ult ? 6 : 3.5}" fill="var(--accent)"/>`; });
  const u = pts[pts.length - 1];
  s += `<text x="${Math.min(x(pts.length - 1), W - de - 4)}" y="${y(u.v) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${u.v} kg</text>`;
  s += `<text x="${x(0)}" y="${H - 6}" text-anchor="start">${fechaCorta(deClave(pts[0].k))}</text>`;
  if (pts.length > 1) s += `<text x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fechaCorta(deClave(u.k))}</text>`;
  return s + `</svg>`;
}

/* ---------- Vista: Ajustes ---------- */
function pintarAjustes() {
  const grupos = [...new Set(CATALOGO.map(e => e.grupo))];
  let h = `<div class="wrap" style="padding:0">
    <section class="card"><label class="campo" for="nombre" style="font-size:1rem;color:var(--ink)"><b>¿Cómo te llamamos?</b></label>
      <input id="nombre" value="${esc(Datos.ajustes.nombre)}" placeholder="Por ejemplo: Papá" style="min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:4px 12px"></section>
    <section class="card"><h2>Ejercicios que puedo hacer</h2>
      <p class="muted small" style="margin:0">Quita los que el médico o el entrenador te hayan desaconsejado, o las máquinas que no tenga tu gimnasio. Las sesiones solo usarán los marcados.</p>`;
  for (const g of grupos) {
    h += `<div><p class="eyebrow" style="margin:12px 0 0">${esc(g)}</p><div class="lista-ajustes">${CATALOGO.filter(e => e.grupo === g).map(e => `<label><input type="checkbox" id="aj-${e.id}" data-activo="${e.id}" ${Datos.ajustes.desactivados.includes(e.id) ? "" : "checked"}><span>${esc(e.nombre)}</span></label>`).join("")}</div></div>`;
  }
  h += `</section>
    <section class="card"><h2>Semana tipo</h2><p class="muted small" style="margin:0">Lunes, miércoles y viernes: gimnasio. Martes, jueves y sábado: paseo. Domingo: descanso. Cada día puedes cambiarlo arriba en <b>Hoy</b>.</p></section>
    <section class="card"><h2>Importante</h2><p class="muted small" style="margin:0">Esta libreta te ayuda a ser constante, pero no sustituye al médico ni al entrenador. Los pesos y tiempos iniciales son orientativos: ajústalos a lo que hacías con el entrenador. Ante cualquier síntoma raro, para.</p></section>
  </div>`;
  $("#vista").innerHTML = h;
}

/* ---------- Eventos ---------- */
function pintar() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === pestaña)));
  $("#saludo").textContent = Datos.ajustes.nombre ? `Hola, ${Datos.ajustes.nombre}` : "Cuaderno de Fuerza";
  if (pestaña === "hoy") pintarHoy(); else if (pestaña === "progreso") pintarProgreso(); else pintarAjustes();
}

document.querySelector("nav.tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-tab]"); if (!b) return;
  pestaña = b.dataset.tab; pintar(); window.scrollTo(0, 0);
  try { localStorage.setItem(LS + "-tab", pestaña); } catch (e) {}
});

$("#vista").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const d = Datos.dias[HOY];
  if (b.dataset.energia) { d.energia = Number(b.dataset.energia); tocar(HOY); }
  else if ("alerta" in b.dataset) { d.alerta = !d.alerta; tocar(HOY); }
  else if (b.dataset.tipo) {
    d.tipo = b.dataset.tipo;
    if (d.tipo === "gym" && !(d.ejercicios || []).length) d.ejercicios = generarSesion(HOY);
    tocar(HOY);
  }
  else if (b.dataset.check) { const e = d.ejercicios[Number(b.dataset.check)]; e.hecho = !e.hecho; tocar(HOY); }
  else if (b.dataset.sens) { const e = d.ejercicios[Number(b.dataset.sens)]; e.sensacion = e.sensacion === b.dataset.v ? "" : b.dataset.v; tocar(HOY); }
  else if (b.dataset.cambiar) {
    const i = Number(b.dataset.cambiar), actual = POR_ID[d.ejercicios[i].id];
    const usados = d.ejercicios.map(e => e.id);
    const opciones = CATALOGO.filter(e => e.grupo === actual.grupo && !usados.includes(e.id) && !Datos.ajustes.desactivados.includes(e.id));
    if (!opciones.length) { b.textContent = "No hay otro de este grupo"; b.disabled = true; return; }
    const sig = opciones[Math.floor(Math.random() * opciones.length)];
    d.ejercicios[i] = nuevaEntrada(sig, HOY); tocar(HOY);
  }
  else if ("regenerar" in b.dataset) {
    const hechos = d.ejercicios.filter(e => e.hecho);
    const nueva = generarSesion(HOY + Math.random(), d.ejercicios.filter(e => !e.hecho).map(e => e.id));
    // Conserva lo ya hecho y sustituye solo lo pendiente.
    const huecos = d.ejercicios.length - hechos.length;
    d.ejercicios = [...hechos, ...nueva.filter(n => !hechos.some(h => h.id === n.id)).slice(0, huecos)];
    tocar(HOY);
  }
  else if (b.dataset.psens) { d.paseo = d.paseo || {}; d.paseo.esfuerzo = d.paseo.esfuerzo === b.dataset.psens ? "" : b.dataset.psens; tocar(HOY); }
  else return;
  const y = window.scrollY; pintar(); window.scrollTo(0, y);
});

$("#vista").addEventListener("change", ev => {
  const t = ev.target, d = Datos.dias[HOY];
  if (t.dataset.campo) { d.ejercicios[Number(t.dataset.campo)][t.dataset.k] = t.value === "" ? "" : Number(t.value); tocar(HOY); }
  else if (t.dataset.paseo) { d.paseo = d.paseo || {}; d.paseo[t.dataset.paseo] = t.value === "" ? "" : Number(t.value); tocar(HOY); }
  else if (t.id === "nota") { d.nota = t.value; tocar(HOY); }
  else if (t.id === "nombre") { Datos.ajustes.nombre = t.value.trim(); Datos.guardarAjustes(); pintar(); }
  else if (t.dataset.activo) {
    const id = t.dataset.activo, set = new Set(Datos.ajustes.desactivados);
    t.checked ? set.delete(id) : set.add(id);
    Datos.ajustes.desactivados = [...set]; Datos.guardarAjustes();
    // Si hoy aún no se ha empezado el gimnasio, rehace la sesión con la nueva lista.
    const hoy = Datos.dias[HOY];
    if (hoy && hoy.tipo === "gym" && !hoy.ejercicios.some(e => e.hecho)) hoy.ejercicios = generarSesion(HOY);
  }
  else if (t.id === "selMaquina") { sessionSel = t.value; pintar(); }
});

/* ---------- Arranque ---------- */
$("#fechaHoy").textContent = fechaLarga(new Date());
Datos.cargarLocal();
try { const t = localStorage.getItem(LS + "-tab"); if (t && ["hoy", "progreso", "ajustes"].includes(t)) pestaña = t; } catch (e) {}
pintar();
Datos.conectarNube().then(ok => { if (ok) { avisoGuardado(true); const y = window.scrollY; if (!document.activeElement?.matches("input,textarea,select")) { pintar(); window.scrollTo(0, y); } } });
</script>
